name: linter ai-service test
on:
  push:
    branches:
      - main
      - master
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install Dependecies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements/dev.txt
          cd ai-service

      - name: Isort check
        run: isort . --check-only

      - name: black
        run: black --check .

      - name: flake8
        run: flake8 .