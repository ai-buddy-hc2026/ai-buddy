name: go test
on:
  push:
    branches:
      - ai-service
      - main
      - master
  pull_request:
    branches:
      - 'codex/**'
      - ai-service
      - main
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_buddy_test
          POSTGRES_PASSWORD: synthetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_buddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic_test@localhost:5432/ai_buddy_test?sslmode=disable
      POSTGRES_PORT: '55432'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Vet
        run: go vet ./...

      - name: Compose startup and authorization
        working-directory: ${{ github.workspace }}
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait backend
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc 'SELECT count(*) FROM users')" = 6
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          base = 'http://localhost:8080'
          with urllib.request.urlopen(base + '/health') as response:
              assert response.status == 200
          try:
              urllib.request.urlopen(base + '/me')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('missing token was accepted')
          request = urllib.request.Request(base + '/auth/mock-login',
              data=json.dumps({'login': 'intern_anya'}).encode(),
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              assert response.status == 200
              result = json.load(response)
          request = urllib.request.Request(base + '/me',
              headers={'Authorization': 'Bearer ' + result['access_token']})
          with urllib.request.urlopen(request) as response:
              assert response.status == 200
              assert json.load(response)['login'] == 'intern_anya'
          print('health=200, login=200, me=200, no-token=401, users=6')
          PY

      - name: Compose logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file .env.example logs --tail 80 db-init backend postgres

      - name: Compose cleanup
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file .env.example down

      - name: Upload Go Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Go-coverage
          path: backend/coverage.txt
          if-no-files-found: error
