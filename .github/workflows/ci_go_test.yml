name: go test
on:
  push:
    branches:
      - ai-service
      - main
      - master
  pull_request:
    branches:
      - 'codex/**'
      - 'feat/**'
      - ai-service
      - main
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_buddy_test
          POSTGRES_PASSWORD: synthetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_buddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgres://postgres:synthetic_test@localhost:5432/ai_buddy_test?sslmode=disable
      POSTGRES_PORT: '55432'
      REDIS_PORT: '56379'
      BACKEND_PORT: '18080'
      AI_SERVICE_PORT: '18001'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Vet
        run: go vet ./...

      - name: Compose startup and authorization
        working-directory: ${{ github.workspace }}
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait backend
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc 'SELECT count(*) FROM users')" = 6
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc 'SELECT count(*) FROM onboarding_plans')" = 2
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc 'SELECT count(*) FROM tasks')" = 30
          docker compose run --rm db-init
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc 'SELECT count(*) FROM task_status_history')" = 30
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          base = 'http://localhost:18080'
          with urllib.request.urlopen(base + '/health') as response:
              assert response.status == 200
          try:
              urllib.request.urlopen(base + '/me')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('missing token was accepted')
          request = urllib.request.Request(base + '/auth/mock-login',
              data=json.dumps({'login': 'intern_anya'}).encode(),
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              assert response.status == 200
              result = json.load(response)
          request = urllib.request.Request(base + '/me',
              headers={'Authorization': 'Bearer ' + result['access_token']})
          with urllib.request.urlopen(request) as response:
              assert response.status == 200
              assert json.load(response)['login'] == 'intern_anya'
          headers = {'Authorization': 'Bearer ' + result['access_token']}
          with urllib.request.urlopen(urllib.request.Request(base + '/onboarding/plan', headers=headers)) as response:
              plan = json.load(response)
              assert plan['progress'] == {'done': 0, 'total': 15, 'percent': 0}
          tasks = [task for stage in plan['stages'] for task in stage['tasks']]
          own_task = next(task for task in tasks if task['assignee_id'] == result['user']['id'])
          other_task = next(task for task in tasks if task['assignee_id'] != result['user']['id'])
          def patch(task, version):
              request = urllib.request.Request(base + '/tasks/' + task['id'], method='PATCH',
                  data=json.dumps({'status': 'done', 'version': version}).encode(),
                  headers={**headers, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)
          assert patch(other_task, 1)[0] == 403
          status, updated = patch(own_task, 1)
          assert status == 200 and updated['version'] == 2
          assert patch(own_task, 2)[0] == 200
          assert patch(own_task, 1)[0] == 409
          with urllib.request.urlopen(urllib.request.Request(base + '/onboarding/plan', headers=headers)) as response:
              assert json.load(response)['progress']['done'] == 1
          print('health/login/me/plan/patch=200, no-token=401, forbidden=403, stale-version=409')
          PY
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc 'SELECT count(*) FROM task_status_history')" = 31
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc "SELECT count(*) FROM events WHERE event_type='task_status_changed'")" = 1
          test "$(docker compose exec -T postgres psql -U ai_buddy -d ai_buddy -Atc "SELECT count(*) FROM events WHERE event_type='policy_denied'")" = 1

      - name: Chat SSE through Python and Redis
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f docker-compose.yml -f compose.test.yml config --quiet
          docker compose -f docker-compose.yml -f compose.test.yml up --build -d --wait backend ai-service mock-llm
          python3 tests/chat_sse_smoke.py --base-url http://127.0.0.1:18080

      - name: Compose logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file .env.example -f docker-compose.yml -f compose.test.yml logs --tail 80 db-init backend postgres redis ai-service mock-llm

      - name: Compose cleanup
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file .env.example -f docker-compose.yml -f compose.test.yml down

      - name: Upload Go Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Go-coverage
          path: backend/coverage.txt
          if-no-files-found: error
