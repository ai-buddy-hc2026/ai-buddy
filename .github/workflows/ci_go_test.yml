name: go test
on:
  push:
    branches:
      - ai-service
      - main
      - master
  pull_request:
    branches:
      - 'codex/**'
      - ai-service
      - main
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_buddy_test
          POSTGRES_PASSWORD: synthetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_buddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic_test@localhost:5432/ai_buddy_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Upload Go Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Go-coverage
          path: backend/coverage.txt
          if-no-files-found: error
