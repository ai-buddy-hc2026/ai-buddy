<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>AI-buddy для Авито</title>
    <script>
      // Тема до первой отрисовки, чтобы не мигал светлый фон
      try {
        var saved = JSON.parse(localStorage.getItem('buddy.settings') || '{}')
        var theme = saved.state && saved.state.theme
        if (!theme || theme === 'system')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
