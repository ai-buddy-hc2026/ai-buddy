server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Go API под тем же origin: /api/* -> сервис backend из docker-compose (порт 8080).
    # CORS не нужен. Адрес резолвится на запросе через DNS Docker, поэтому образ
    # стартует и без backend (запросы к /api тогда получат 502).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE /chat/stream/{id}: токены уходят в браузер сразу, без буфера nginx
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # SPA: неизвестные пути отдаём в index.html, роутинг делает TanStack Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
